[project]
name = "gfxhat"
version = "0.2.0"
description = "Python library for driving Pimoroni GFX HAT!"
license = "MIT"
requires-python = ">= 3.10"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
maintainers = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
keywords = [
    "Pi",
    "Raspberry",
]
dependencies = [
    "gpiozero", "spidev", "Pillow", "sn3218"
]
urls = { GitHub = "https://github.com/pimoroni/gfx-hat" }
readme = "README.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
exclude = [
    '.tox',
    '.egg',
    '.git',
    '__pycache__',
    'build',
    'dist'
]
line-length = 200

[tool.check-manifest]
ignore = [
    '.stickler.yml',
    'boilerplate.md',
    'check.sh',
    'install.sh',
    'uninstall.sh',
    'Makefile',
    'tox.ini',
    'tests/*',
    'examples/*',
    '.coveragerc',
    'requirements-dev.txt'
]

[tool.pimoroni]
apt_packages = []
configtxt = []
commands = []

[dependency-groups]
dev = [
    "ruff (>=0.14.3,<0.15.0)"
]
test = [
    "pytest (>=8.4.2,<9.0.0)"
]
